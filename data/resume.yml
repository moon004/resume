selfPr:
  - title:
      {
        ja: "顧客の課題を起点に、要件からアーキテクチャまで描ける",
        en: "From customer pain points to architecture",
      }
    body:
      ja: "テックリードとしてプロダクトオーナーと協働し、顧客のペインポイントを特定したうえでシステム要件全体とアーキテクチャを策定してきました。要件を開発者が迷わず実装できる粒度のドキュメントに落とし込み、フロントエンド・バックエンド双方のテストを設計・整備することで、品質を担保しながらプロジェクトを完遂まで導いています。"
      en: "As Tech Lead I work with the product owner to identify customers' pain points, then draft the full system requirements and architecture. I translate them into documentation developers can act on without ambiguity, and design and set up frontend and backend tests so that projects reach production with their quality assured."
  - title: { ja: "チームを機能させるマネジメント", en: "Making teams work" }
    body:
      ja: "チームリーダーとしてタスク割り当てなどのリソース管理とクライアントとのコミュニケーションを担い、現在は5名のチームをスクラム（プランニングポーカー）とチケット駆動開発で運営しています。複数の AWS CDK プロジェクトの並行オーケストレーションなど、チーム横断の調整も担当しています。"
      en: "I have managed team resources and client communication as a team leader, and currently run a team of five with Scrum planning poker and ticket-based development, including orchestrating multiple AWS CDK projects in parallel."
  - title:
      {
        ja: "データで意思決定し、運用まで見届ける",
        en: "Deciding with data, owning it in production",
      }
    body:
      ja: "施策はイベントトリガーの設計から BigQuery（Dataform）への計測基盤整備、Variation / Control の採用判断まで一気通貫で検証しています。リリース後も Datadog のアラート・レポートと SLI・SLO で運用品質を可視化し、作って終わりではなく成果と安定性まで責任を持つことを大切にしています。"
      en: "I validate every initiative end-to-end — from event-trigger design and the measurement pipeline into BigQuery (Dataform) to the analysis that decides whether to adopt variation or control. After release I keep watch through Datadog alerting and SLI/SLOs, taking responsibility not just for shipping but for outcomes and stability."

