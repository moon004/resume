    body:
      ja: "テックリードとしてプロダクトオーナーと協働し、顧客のペインポイントを特定したうえでシステム要件全体とアーキテクチャを策定してきました。要件を開発者が迷わず実装できる粒度のドキュメントに落とし込み、フロントエンド・バックエンド双方のテストを設計・整備することで、品質を担保しながらプロジェクトを完遂まで導いています。"
