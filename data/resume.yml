# 職務要約（短く、要点のみ。web / 職務経歴書で共通。> で折り返すと 1 段落になる）
summary:
  # 日本語は折り返しで空白が入るため 1 行で書く
  ja: "多言語で働けるフルスタックエンジニア。5名チームを率いてリリースまで導いた経験と、エンジニアリングマネジメント（EM）の知見を持ちます。ユーザーのペインポイントを引き出し、DDD とクリーンアーキテクチャによるマイクロサービス設計で、偶有的複雑性（accidental complexity）を最小限に抑えたソリューションに落とし込むのが得意です。Kubernetes / Terraform でのインフラ運用やチーム全体の改善も主導し、イベント計測から BigQuery での効果検証まで、プロダクト分析を一気通貫で担います。"
  en: >
    Multilingual full-stack engineer who has led a five-person team to release and brings a working knowledge of
    engineering management. Skilled at drawing out users' pain points and turning them into solutions that carry
    the least possible accidental complexity, through DDD and clean-architecture microservice design on a
    Kubernetes stack with hands-on Terraform experience. Regularly takes the lead on team-wide improvements, and
    covers product analytics end-to-end — event instrumentation into BigQuery through to the impact analysis
    behind each ship decision.

